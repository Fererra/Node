# Local PostgreSQL for development and tests (spec 02, NFR-8).
# Host port 55432, not the default 5432, so it doesn't clash with a local
# PostgreSQL. Two databases: `cinema` (DATABASE_URL) and `cinema_test`
# (TEST_DATABASE_URL), created by docker/postgres/init.sql.
services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
      POSTGRES_DB: cinema
    ports:
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cinema -d cinema']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
