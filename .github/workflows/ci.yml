name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Like local runs (spec 03 NFR-4): PostgreSQL from Docker Compose,
      # database URLs from .env.example (no .env in CI).
      - run: make test
